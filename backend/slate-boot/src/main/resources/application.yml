# 域/模块: 平台底座/启动器
# 类型: 全局配置
# 职责: slate 单体配置——数据源（createDatabaseIfNotExist + 启动建表/种子，幂等可重复）、Redis、JWT、雪花 ID
# 设计文档: docs/design/平台底座/design.md
# 维护者: 协调者 / agent-fffabc
spring:
  application:
    name: slate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}   # local 配置不入库（application-local.yml）
  datasource:
    url: ${SLATE_MYSQL_URL:jdbc:mysql://localhost:3306/slate?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SLATE_MYSQL_USER:user}
    password: ${SLATE_MYSQL_PASSWORD:}   # 密码不落库：环境变量或 application-local.yml 提供
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always   # 幂等：表 CREATE IF NOT EXISTS，种子 INSERT IGNORE
      encoding: UTF-8   # SQL 脚本编码（Windows 默认 GBK 会把中文种子写坏）
      schema-locations: classpath:db/init/01_schema.sql,classpath:db/init/03_schema_org.sql,classpath:db/init/05_schema_user.sql
      data-locations: classpath:db/init/02_seed.sql,classpath:db/init/04_seed_org.sql,classpath:db/init/06_seed_user.sql
  data:
    redis:
      host: ${SLATE_REDIS_HOST:localhost}
      port: ${SLATE_REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

slate:
  id:
    worker: 1   # 雪花 ID 机器号（0~1023），多实例部署必须唯一
  jwt:
    # HS256 密钥 ≥32 字节；生产必须经环境变量注入，此默认值仅本地开发
    secret: ${SLATE_JWT_SECRET:slate-dev-only-secret-key-32bytes!!}
    access-ttl: PT2H    # 双 token 定稿（api-conventions §2）
    refresh-ttl: P7D
  crypto:
    # 敏感字段 AES-256-GCM 密钥（32 字节）；生产必须经环境变量注入，此默认值仅本地开发
    key: ${SLATE_CRYPTO_KEY:0123456789abcdef0123456789abcdef}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"   # TraceIdFilter 写入的 MDC 键，与响应 traceId 同源
