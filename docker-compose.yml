# 域/模块: 平台底座/本地基础设施
# 类型: Docker Compose
# 职责: 本地开发依赖——Redis 7（refresh 白名单/失败锁定/权限缓存，AOF 持久化：重启不掉登录态）；
#       MinIO（对象存储，卷持久化）；MySQL 8 用本机已装实例（3306）
# 设计文档: docs/design/平台底座/design.md
# 维护者: 协调者 / agent-fffabc
# 用法：docker compose up -d（仓库根执行）；MinIO 控制台 http://localhost:9001（minioadmin/minioadmin）
services:
  redis:
    image: redis:7-alpine
    container_name: slate-redis
    # AOF 持久化：refresh 白名单/上传凭证/幂等键是有状态数据，重启不能丢（丢=全员掉线+锁定失效）
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - slate-redis-data:/data
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    container_name: slate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin   # 本地开发默认值；生产必须改
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - slate-minio-data:/data
    restart: unless-stopped

volumes:
  slate-redis-data:
  slate-minio-data:
