# 域/模块: 平台底座/本地基础设施
# 类型: Docker Compose
# 职责: 本地开发依赖——Redis 7（refresh 白名单/失败锁定/权限缓存）；MySQL 7 用本机已装实例（3306）
# 设计文档: docs/design/平台底座/design.md
# 维护者: 协调者 / agent-fffabc
# 用法：docker compose up -d（仓库根执行）；MinIO 控制台 http://localhost:9001（minioadmin/minioadmin）
services:
  redis:
    image: redis:7-alpine
    container_name: slate-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    container_name: slate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin   # 本地开发默认值；生产必须改
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - slate-minio-data:/data
    restart: unless-stopped

volumes:
  slate-minio-data:
