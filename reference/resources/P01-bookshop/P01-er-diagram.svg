<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680"
     font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
        </marker>
    </defs>

    <rect width="1000" height="680" fill="#ffffff"/>
    <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">图书销售系统 · E-R 图</text>
    <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">矩形=实体 · 菱形=联系 · 下划线字段=主键 · FK=外键</text>

    <!-- ===== 实体：t_user ===== -->
    <g>
        <rect x="40" y="110" width="185" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <rect x="40" y="110" width="185" height="30" rx="6" fill="#2563eb"/>
        <text x="132" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">t_user 用户</text>
        <text x="56" y="158" font-size="12" fill="#0f172a">
            <tspan text-decoration="underline" font-weight="700">id</tspan>
            INT PK
        </text>
        <text x="56" y="178" font-size="12" fill="#334155">username 唯一</text>
        <text x="56" y="198" font-size="12" fill="#334155">password BCrypt</text>
        <text x="56" y="218" font-size="12" fill="#334155">email / phone</text>
        <text x="56" y="238" font-size="12" fill="#334155">status 1正常 0禁用</text>
    </g>

    <!-- ===== 实体：t_address（弱实体，双线框） ===== -->
    <g>
        <rect x="40" y="330" width="185" height="130" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
        <rect x="46" y="336" width="173" height="118" rx="4" fill="none" stroke="#ca8a04" stroke-width="2"/>
        <rect x="40" y="330" width="185" height="30" rx="6" fill="#ca8a04"/>
        <text x="132" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">t_address 地址</text>
        <text x="890" y="-1" font-size="1" fill="none">.</text>
        <text x="56" y="378" font-size="12" fill="#0f172a">
            <tspan text-decoration="underline" font-weight="700">id</tspan>
            INT PK
        </text>
        <text x="56" y="398" font-size="12" fill="#334155">user_id INT FK</text>
        <text x="56" y="418" font-size="12" fill="#334155">receiver / phone</text>
        <text x="56" y="438" font-size="12" fill="#334155">province/city/detail</text>
        <text x="132" y="480" text-anchor="middle" font-size="11" font-style="italic" fill="#ca8a04">弱实体（双框）：无用户即无地址</text>
    </g>

    <!-- ===== 联系菱形：拥有 ===== -->
    <g>
        <path d="M150,268 L200,298 L250,268 L200,238 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="200" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">拥有</text>
        <text x="200" y="278" text-anchor="middle" font-size="11" fill="#64748b">1</text>
        <text x="200" y="325" text-anchor="middle" font-size="11" fill="#64748b">N</text>
    </g>
    <line x1="200" y1="260" x2="200" y2="238" stroke="#475569" stroke-width="2"/>
    <line x1="200" y1="298" x2="200" y2="330" stroke="#475569" stroke-width="2"/>

    <!-- ===== 实体：t_order ===== -->
    <g>
        <rect x="400" y="110" width="195" height="150" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <rect x="400" y="110" width="195" height="30" rx="6" fill="#16a34a"/>
        <text x="497" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">t_order 订单</text>
        <text x="416" y="158" font-size="12" fill="#0f172a">
            <tspan text-decoration="underline" font-weight="700">id</tspan>
            INT PK
        </text>
        <text x="416" y="178" font-size="12" fill="#334155">order_no 唯一</text>
        <text x="416" y="198" font-size="12" fill="#334155">user_id INT FK</text>
        <text x="416" y="218" font-size="12" fill="#334155">total_amount 金额</text>
        <text x="416" y="238" font-size="12" fill="#334155">status 0待付…4取消</text>
    </g>

    <!-- 联系：下单 user -> order -->
    <g>
        <path d="M300,175 L340,175 L380,145 L340,115 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="340" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">下单</text>
        <text x="288" y="180" text-anchor="middle" font-size="11" fill="#64748b">1</text>
        <text x="392" y="132" text-anchor="middle" font-size="11" fill="#64748b">N</text>
    </g>
    <line x1="225" y1="175" x2="300" y2="175" stroke="#475569" stroke-width="2"/>
    <line x1="368" y1="158" x2="400" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ===== 实体：t_order_item（M:N 关联表） ===== -->
    <g>
        <rect x="400" y="330" width="195" height="130" rx="6" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
        <rect x="400" y="330" width="195" height="30" rx="6" fill="#a21caf"/>
        <text x="497" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">t_order_item 明细</text>
        <text x="416" y="378" font-size="12" fill="#0f172a">
            <tspan text-decoration="underline" font-weight="700">id</tspan>
            INT PK
        </text>
        <text x="416" y="398" font-size="12" fill="#334155">order_id FK → t_order</text>
        <text x="416" y="418" font-size="12" fill="#334155">book_id FK → t_book</text>
        <text x="416" y="438" font-size="12" fill="#334155">quantity / price 快照</text>
    </g>

    <!-- 联系：包含 order -> item -->
    <g>
        <path d="M497,268 L547,298 L597,268 L547,238 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="547" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">包含</text>
        <text x="525" y="255" text-anchor="middle" font-size="11" fill="#64748b">1</text>
        <text x="572" y="255" text-anchor="middle" font-size="11" fill="#64748b">N</text>
    </g>
    <line x1="497" y1="260" x2="497" y2="238" stroke="#475569" stroke-width="2"/>
    <line x1="547" y1="298" x2="497" y2="330" stroke="#475569" stroke-width="2"/>

    <!-- ===== 实体：t_book ===== -->
    <g>
        <rect x="760" y="330" width="200" height="150" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
        <rect x="760" y="330" width="200" height="30" rx="6" fill="#ea580c"/>
        <text x="860" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">t_book 图书</text>
        <text x="776" y="378" font-size="12" fill="#0f172a">
            <tspan text-decoration="underline" font-weight="700">id</tspan>
            INT PK
        </text>
        <text x="776" y="398" font-size="12" fill="#334155">title / author</text>
        <text x="776" y="418" font-size="12" fill="#334155">isbn 唯一</text>
        <text x="776" y="438" font-size="12" fill="#334155">price / stock</text>
        <text x="776" y="458" font-size="12" fill="#334155">category_id FK</text>
    </g>

    <!-- 联系：记载 item -> book -->
    <g>
        <path d="M660,395 L700,395 L740,365 L700,335 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="700" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">记载</text>
        <text x="648" y="400" text-anchor="middle" font-size="11" fill="#64748b">N</text>
        <text x="752" y="352" text-anchor="middle" font-size="11" fill="#64748b">1</text>
    </g>
    <line x1="595" y1="395" x2="660" y2="395" stroke="#475569" stroke-width="2"/>
    <line x1="728" y1="378" x2="760" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ===== 实体：t_category（自关联） ===== -->
    <g>
        <rect x="760" y="110" width="200" height="120" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
        <rect x="760" y="110" width="200" height="30" rx="6" fill="#64748b"/>
        <text x="860" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">t_category 分类</text>
        <text x="776" y="158" font-size="12" fill="#0f172a">
            <tspan text-decoration="underline" font-weight="700">id</tspan>
            INT PK
        </text>
        <text x="776" y="178" font-size="12" fill="#334155">name / sort_order</text>
        <text x="776" y="198" font-size="12" fill="#334155">parent_id FK → 自身</text>
        <text x="860" y="258" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">自关联：支持多级分类（计算机→Java）</text>
    </g>

    <!-- 自关联回环 -->
    <path d="M960,140 C1000,90 1000,60 940,62 L900,62" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="920" y="80" font-size="11" fill="#64748b">1:N</text>

    <!-- 联系：归属 book -> category -->
    <line x1="860" y1="330" x2="860" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="870" y="290" font-size="12" font-weight="700" fill="#0f172a">归属 N:1</text>

    <!-- ===== 图例 ===== -->
    <g>
        <rect x="40" y="540" width="920" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="60" y="566" font-size="13" font-weight="700" fill="#0f172a">设计要点（对照文档 2.x / 4.x 节）</text>
        <text x="60" y="590" font-size="12" fill="#334155">1. M:N（订单×图书）必须拆出关联表 t_order_item，主键用代理键 id，业务上再加 (order_id, book_id)
            唯一索引防重复
        </text>
        <text x="60" y="612" font-size="12" fill="#334155">2. t_address 是弱实体：主键 id 独立，但 user_id 非空 + ON DELETE CASCADE，用户删除则地址随之删除</text>
        <text x="60" y="634" font-size="12" fill="#334155">3. t_order.receiver / t_order_item.price 是「快照」字段：下单后即使改价/改地址，历史订单不变</text>
    </g>
</svg>
