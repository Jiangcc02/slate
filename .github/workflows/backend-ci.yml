# 域/模块: 平台底座/CI 防线
# 类型: CI 工作流
# 职责: PR→dev 的后端防线——编译+测试（含 ArchUnit 依赖规则）+ L1 文件头检查，违规即失败
# 设计文档: docs/design/平台底座/design.md
# 维护者: 协调者 / agent-fffabc
name: 后端 CI 防线

on:
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  verify:
    name: 编译 + 测试 + 架构防线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 编译与测试（含 ArchUnit）
        run: mvn -B -f backend/pom.xml verify

      - name: L1 文件头检查
        run: bash backend/scripts/check-file-headers.sh
